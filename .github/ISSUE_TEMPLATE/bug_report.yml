name: Bug report
description: 报告插件的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息，这样能更快定位。

  - type: input
    id: dsh-version
    attributes:
      label: DSH 运行时版本
      description: 执行 dsh --version；请另行注明操作系统及桌面或浏览器宿主
      placeholder: '0.2.1-rc.3 / Windows 桌面宿主'
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: '0.1.5'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开任意会话
        2. 点击模型按钮
        3. 选择某个供应商
        4. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台报错 / 截图
      description: 脱敏后的错误诊断、Console 内容或截图；不要提交密钥、私人会话或完整 profile 配置
      render: shell
    validations:
      required: false
