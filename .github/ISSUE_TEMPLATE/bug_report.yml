name: Bug report
description: 报告插件的问题
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的信息，这样能更快定位。

  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness 版本
      description: 设置 → 关于，或 `DeepSeek Harness.exe` 同目录的 `version` 文件
      placeholder: '44.7.0'
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      placeholder: '0.1.0'
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开任意会话
        2. 点击模型按钮
        3. 选择 lyrouter
        4. 看到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 控制台报错 / 截图
      description: 浏览器开发者工具 Console 面板的内容，或截图
      render: shell
    validations:
      required: false
