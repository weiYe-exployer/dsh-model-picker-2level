name: Feature request
description: 提出功能建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述当前的痛点，而不是直接给方案，这样更容易找到更好的做法
      placeholder: '当我有 5 家以上供应商时，一级列表变得很长……'
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
